name: analysis-smoke-test

on:
  push:
    branches: ["merge", "main"]
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile source
        run: python -m compileall -q main.py src dashboard.py

      - name: Run sample summary
        run: python main.py --sample --summary

      - name: Generate portfolio report
        run: python main.py --sample --export-report
